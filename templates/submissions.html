    <div id="submissions">
        {% for submission in submissions %}
        <h3>{{ submission.org }}</h3>
        <p>id: {{ submission.id }}</p>
        <p>name: {{ submission.name }}</p>
        <p>email: {{ submission.email }}</p>
        <p>submitted: {{ submission.created_at }}</p>
        <p>{{ submission.message }}</p>
        {% endfor %}
    </div>
